<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Онлайн-запись</title>
  <script>
    // У GitHub Pages нет серверных маршрутов: на /cyd/admin или /cyd/b/<токен> он отдаёт этот файл.
    // Передаём путь приложению через ?p= — оно само откроет нужный экран (см. src/lib/spa-redirect.ts).
    (function () {
      var l = window.location;
      if (l.pathname === '/' || l.search.indexOf('p=') !== -1) return;
      l.replace(l.origin + '/?p=' + encodeURIComponent(l.pathname) + (l.search ? '&' + l.search.slice(1) : '') + l.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui, sans-serif; background: #0b0c0f; color: #a1a7b3; }
  </style>
</head>
<body>
  <noscript>Включите JavaScript, чтобы открыть онлайн-запись.</noscript>
</body>
</html>
