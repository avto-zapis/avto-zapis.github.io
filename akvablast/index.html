    <script>
      // цвет, тема и шрифт бизнеса до первой отрисовки: страницу может отдать Service Worker, он не знает, чья она
      (function () {
        try {
          var slug = location.pathname.split('/')[1]
          var l = JSON.parse(localStorage.getItem('tenant-look:' + slug) || 'null')
          if (!l) return
          var p = localStorage.getItem('theme-pref:' + slug)
          if (p === 'light' || p === 'dark') l.t = p
          var r = document.documentElement
          r.classList.toggle('dark', l.t === 'dark')
          r.dataset.theme = l.t
          r.dataset.font = l.f
          r.style.setProperty('--brand', l.c)
          r.style.setProperty('--brand-foreground', l.b)
        } catch (e) {}
      })()
    </script>
